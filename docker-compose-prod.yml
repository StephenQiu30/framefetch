# Production overrides. Always select the production environment explicitly:
# docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose-prod.yml up -d --build --wait
services:
  egress-proxy:
    # Squid sizes descriptor tables from RLIMIT_NOFILE. Some Linux hosts pass
    # a billion-descriptor limit to containers, causing startup allocation failure.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
  migrate:
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-framefetch}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env.prod}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-framefetch}
  api:
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-framefetch}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env.prod}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-framefetch}
      RABBITMQ_URL: amqp://${RABBITMQ_API_USER:-framefetch-api}:${RABBITMQ_API_PASS:?Configure RABBITMQ_API_PASS in .env.prod}@${RABBITMQ_HOST:-host.docker.internal}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-framefetch}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Configure AUTH_JWT_SECRET in .env.prod}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:?Configure AUTH_BOOTSTRAP_ADMIN_EMAIL in .env.prod}
      AUTH_BOOTSTRAP_ADMIN_SECRET: ${AUTH_BOOTSTRAP_ADMIN_SECRET:?Configure AUTH_BOOTSTRAP_ADMIN_SECRET in .env.prod}
      METRICS_ACCESS_KEY: ${METRICS_ACCESS_KEY:?Configure METRICS_ACCESS_KEY in .env.prod}
      REQUEST_FINGERPRINT_SECRET: ${REQUEST_FINGERPRINT_SECRET:?Configure REQUEST_FINGERPRINT_SECRET in .env.prod}
      RUNNER_HMAC_SECRET: ${RUNNER_HMAC_SECRET:?Configure RUNNER_HMAC_SECRET in .env.prod}
      URL_ENCRYPTION_KEY: ${URL_ENCRYPTION_KEY:?Configure URL_ENCRYPTION_KEY in .env.prod}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Configure MINIO_ACCESS_KEY in .env.prod}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Configure MINIO_SECRET_KEY in .env.prod}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?Configure the public storage endpoint in .env.prod}
      MINIO_PUBLIC_SECURE: 'true'
      MINIO_LOCAL_BROWSER_ENDPOINT: ''
      MINIO_LOCAL_BROWSER_SECURE: 'false'
    develop: !reset null
  frontend:
    build:
      target: runtime
      args:
        SITE_URL: ${SITE_URL:?Configure the public HTTPS origin in .env.prod}
    environment:
      SITE_URL: ${SITE_URL:?Configure the public HTTPS origin in .env.prod}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?Configure the public storage endpoint in .env.prod}
      MINIO_PUBLIC_SECURE: 'true'
      MINIO_LOCAL_BROWSER_ENDPOINT: ''
      MINIO_LOCAL_BROWSER_SECURE: 'false'
    develop: !reset null
  worker:
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-framefetch}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env.prod}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-framefetch}
      RABBITMQ_URL: amqp://${RABBITMQ_WORKER_USER:-framefetch-worker}:${RABBITMQ_WORKER_PASS:?Configure RABBITMQ_WORKER_PASS in .env.prod}@${RABBITMQ_HOST:-host.docker.internal}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-framefetch}
      REQUEST_FINGERPRINT_SECRET: ${REQUEST_FINGERPRINT_SECRET:?Configure REQUEST_FINGERPRINT_SECRET in .env.prod}
      RUNNER_HMAC_SECRET: ${RUNNER_HMAC_SECRET:?Configure RUNNER_HMAC_SECRET in .env.prod}
      URL_ENCRYPTION_KEY: ${URL_ENCRYPTION_KEY:?Configure URL_ENCRYPTION_KEY in .env.prod}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Configure MINIO_ACCESS_KEY in .env.prod}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Configure MINIO_SECRET_KEY in .env.prod}
    develop: !reset null
  session-runner:
    environment:
      APP_ENV: production
      RUNNER_HMAC_SECRET: ${RUNNER_HMAC_SECRET:?Configure RUNNER_HMAC_SECRET in .env.prod}
    develop: !reset null
